<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나의 인생 로드맵 캘린더 2026–2030</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#1f2533;--sub:#6b7385;--line:#e4e7ee;--accent:#3b5bdb;--ok:#2f9e44;--caution:#f08c00;--warn:#e03131;--radius:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',sans-serif;font-size:14px;line-height:1.5}
header{background:linear-gradient(135deg,#1e2a5a,#3b5bdb);color:#fff;padding:22px 28px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;max-width:1280px;margin:0 auto}
h1{margin:0;font-size:22px;letter-spacing:-.3px}
.subtitle{opacity:.85;margin-top:4px;font-size:13px}
.hero{font-size:13px;opacity:.95;text-align:right}
.hero b{font-size:28px;display:block;letter-spacing:-.5px;line-height:1.2}
nav.tabs{display:flex;gap:4px;margin:18px auto 0;flex-wrap:wrap;max-width:1280px}
nav.tabs button{background:transparent;border:0;color:#fff;opacity:.75;padding:10px 16px;font-size:14px;border-radius:10px 10px 0 0;cursor:pointer;font-family:inherit}
nav.tabs button:hover{opacity:1}
nav.tabs button.active{background:var(--bg);color:var(--text);opacity:1;font-weight:700}
main{padding:20px 28px 60px;max-width:1280px;margin:0 auto}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:8px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:13px}
.btn:hover{border-color:#c5cad6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger{color:var(--warn)}
.btn.sm{padding:5px 10px;font-size:12px}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12px;user-select:none}
.fchip i{width:9px;height:9px;border-radius:50%;display:inline-block}
.fchip.off{opacity:.4;text-decoration:line-through}
.spacer{flex:1}
.view{display:none}.view.active{display:block}
.grid{display:grid;gap:16px;align-content:start}
.g2{grid-template-columns:1.3fr 1fr}
.card{background:var(--card);border-radius:var(--radius);padding:18px 20px;box-shadow:0 1px 3px rgba(20,30,60,.06);border:1px solid var(--line)}
.card h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--sub);font-size:12px}
@media(max-width:900px){.g2{grid-template-columns:1fr}main{padding:16px}header{padding:18px 16px 0}}
.ms-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.ms{border-radius:12px;padding:12px 14px;border:1px solid var(--line);border-left:5px solid;cursor:pointer;background:#fff}
.ms:hover{box-shadow:0 2px 8px rgba(20,30,60,.1)}
.ms .dd{font-size:20px;font-weight:800;letter-spacing:-.5px}
.ms .tt{font-weight:600;margin-top:2px}
.ms .dt{color:var(--sub);font-size:12px}
.ms.past{opacity:.55}
.chk{display:flex;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0}
.dot{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700;margin-top:1px}
.lv-ok{background:var(--ok)}.lv-caution{background:var(--caution)}.lv-warn{background:var(--warn)}
.chk .t{font-weight:600}.chk .d{color:var(--sub);font-size:13px}
.wbig{display:flex;align-items:baseline;gap:8px}
.wbig b{font-size:34px;color:#d6336c;letter-spacing:-1px}
.bar{height:12px;background:#f1f3f5;border-radius:99px;overflow:hidden;margin:10px 0 6px}
.bar>div{height:100%;background:linear-gradient(90deg,#f783ac,#d6336c);border-radius:99px;transition:width .4s}
.wmeta{display:flex;justify-content:space-between;color:var(--sub);font-size:12px}
.wform{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
.wform input{flex:1;min-width:110px}
input,select,textarea{font-family:inherit;font-size:13px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--text)}
textarea{resize:vertical;min-height:70px;width:100%}
.wlog{margin-top:10px;max-height:160px;overflow:auto;font-size:13px}
.wlog div{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid #f1f3f5}
.note{font-size:12px;color:#5c5f66;margin-top:10px;background:#fff9db;border-radius:8px;padding:8px 10px}
.up{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid #f1f3f5;cursor:pointer}
.up:last-child{border-bottom:0}
.up:hover .ut{color:var(--accent)}
.up .bd{width:4px;align-self:stretch;border-radius:4px;flex:none}
.up .when{width:92px;flex:none;color:var(--sub);font-size:12px}
.up .ddtag{margin-left:auto;font-size:12px;font-weight:700;color:var(--accent);white-space:nowrap}
.calhead{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.calhead h2{margin:0 8px;font-size:20px;min-width:130px;text-align:center}
.ongoing{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.ongoing .og{font-size:12px;padding:4px 10px;border-radius:99px;color:#fff;cursor:pointer}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--line);gap:1px;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.cal .dow{background:#f8f9fc;text-align:center;padding:8px 0;font-weight:600;font-size:12px;color:var(--sub)}
.cal .day{background:#fff;min-height:112px;padding:6px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden}
.cal .day:hover{background:#f8faff}
.cal .day.other{background:#fbfbfd}.cal .day.other .num,.cal .day.other .chip{opacity:.4}
.cal .num{font-size:12px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;flex:none}
.cal .day.today .num{background:var(--accent);color:#fff}
.sun{color:#e03131}.sat{color:#1c7ed6}
.chip{font-size:11.5px;padding:2px 6px;border-radius:5px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.chip.ms-chip{font-weight:700}
.chip.done{opacity:.45;text-decoration:line-through}
.chip.edge{background:#fff;border:1px solid}
@media(max-width:700px){.cal .day{min-height:74px;padding:3px}.chip{font-size:10px;padding:1px 3px}}
.rm-wrap{overflow-x:auto}
.rm{min-width:880px}
.lane{display:grid;grid-template-columns:120px 1fr;border-bottom:1px solid #f1f3f5}
.lane:last-child{border-bottom:0}
.lane .lb{font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;padding:8px 0}
.lane .lb i{width:10px;height:10px;border-radius:3px}
.track{position:relative}
.tick{position:absolute;top:0;bottom:0;border-left:1px dashed #dee2e6}
.tick span{position:absolute;top:2px;left:4px;font-size:11px;color:var(--sub);font-weight:600}
.todayline{position:absolute;top:0;bottom:0;border-left:2px solid #e03131;z-index:3;pointer-events:none}
.rbar{position:absolute;height:12px;border-radius:6px;cursor:pointer;opacity:.85;z-index:2}
.rbar:hover,.rdot:hover{opacity:1;outline:2px solid rgba(0,0,0,.2)}
.rdot{position:absolute;width:12px;height:12px;border-radius:50%;margin-left:-6px;cursor:pointer;z-index:2;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.mstone{position:absolute;transform:translateX(-50%);text-align:center;cursor:pointer;z-index:2;white-space:nowrap}
.mstone:hover .ml{color:var(--accent)}
.mstone .dm{width:14px;height:14px;transform:rotate(45deg);margin:0 auto;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.mstone .ml{font-size:11.5px;font-weight:700;margin-top:3px}
.mstone .md{font-size:10.5px;color:var(--sub)}
.legend{font-size:12px;color:var(--sub);margin-top:10px}
.lst-year{font-size:16px;font-weight:800;margin:22px 0 8px}
.lst-year:first-child{margin-top:0}
.item{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px}
.item .bd{width:5px;align-self:stretch;border-radius:4px;flex:none}
.item input[type=checkbox]{margin-top:4px}
.item .main{flex:1;cursor:pointer;min-width:0}
.item .main:hover .ti{color:var(--accent)}
.item .ti{font-weight:600}
.item .meta{font-size:12px;color:var(--sub)}
.item .memo{font-size:12px;color:#495057;margin-top:3px;white-space:pre-wrap}
.item.done .ti{text-decoration:line-through;opacity:.5}
.badge{font-size:10.5px;padding:1px 6px;border-radius:5px;background:#edf2ff;color:var(--accent);margin-left:6px;font-weight:600;vertical-align:1px}
.overlay{position:fixed;inset:0;background:rgba(15,20,40,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:480px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25);max-height:92vh;overflow:auto}
.modal h3{margin:0 0 14px}
.field{margin-bottom:12px}
.field label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px;font-weight:600}
.field input[type=text],.field select{width:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row2 input{width:100%}
.checks{display:flex;gap:16px;font-size:13px}
.checks label{display:flex;align-items:center;gap:5px;color:var(--text);font-weight:400;font-size:13px}
.mfoot{display:flex;gap:8px;margin-top:16px}
.empty{color:var(--sub);text-align:center;padding:30px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div>
      <h1>나의 인생 로드맵 캘린더</h1>
      <div class="subtitle">석사 졸업 → 정규직 취업 → 결혼 → 2030.3.1 아파트 입주</div>
    </div>
    <div class="hero" id="hero"></div>
  </div>
  <nav class="tabs" id="tabs">
    <button data-view="dash" class="active">대시보드</button>
    <button data-view="cal">월간 캘린더</button>
    <button data-view="road">로드맵</button>
    <button data-view="list">전체 일정</button>
  </nav>
</header>

<main>
  <div class="toolbar">
    <button class="btn primary" id="addBtn">+ 일정 추가</button>
    <div class="filters" id="filters"></div>
    <div class="spacer"></div>
    <button class="btn sm" id="exportBtn">백업 저장</button>
    <button class="btn sm" id="importBtn">백업 불러오기</button>
    <button class="btn sm danger" id="resetBtn">초기화</button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>

  <section class="view active" id="view-dash">
    <div class="card" style="margin-bottom:16px">
      <h2>🎯 핵심 이정표 <small>카드를 누르면 날짜·내용을 수정할 수 있어요</small></h2>
      <div class="ms-list" id="msList"></div>
    </div>
    <div class="grid g2">
      <div class="grid">
        <div class="card"><h2>✅ 핵심 조건 체크 <small>이정표 날짜를 바꾸면 자동으로 다시 계산돼요</small></h2><div id="checks"></div></div>
        <div class="card"><h2>📌 다가오는 일정 <small>앞으로 90일</small></h2><div id="upcoming"></div></div>
      </div>
      <div class="card" id="weightCard"></div>
    </div>
  </section>

  <section class="view" id="view-cal">
    <div class="calhead">
      <button class="btn" id="prevM">◀</button>
      <h2 id="calTitle"></h2>
      <button class="btn" id="nextM">▶</button>
      <button class="btn sm" id="todayM">오늘</button>
      <select id="jumpY"></select><select id="jumpM"></select>
      <span style="font-size:12px;color:var(--sub);margin-left:6px">날짜 칸을 누르면 그 날짜로 일정이 추가돼요</span>
    </div>
    <div class="ongoing" id="ongoing"></div>
    <div class="cal" id="cal"></div>
  </section>

  <section class="view" id="view-road">
    <div class="card">
      <h2>🗺️ 2026 – 2030 로드맵 <small>막대·점에 마우스를 올리면 제목, 누르면 수정 · 빨간 선은 오늘</small></h2>
      <div class="rm-wrap"><div class="rm" id="roadmap"></div></div>
      <div class="legend">◆ 핵심 이정표 &nbsp;·&nbsp; ● 하루 일정 &nbsp;·&nbsp; ▬ 기간 일정</div>
    </div>
  </section>

  <section class="view" id="view-list">
    <div class="toolbar">
      <input type="text" id="search" placeholder="일정 검색 (제목·메모)" style="flex:1;max-width:320px">
      <label style="font-size:13px;display:flex;align-items:center;gap:5px"><input type="checkbox" id="hidePast"> 지난 일정 숨기기</label>
    </div>
    <div id="list"></div>
  </section>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="mTitle">일정 추가</h3>
    <div class="field"><label>제목</label><input type="text" id="fTitle" placeholder="예) 학위논문 중간발표"></div>
    <div class="field"><label>카테고리</label><select id="fCat"></select></div>
    <div class="row2 field">
      <div><label>시작일</label><input type="date" id="fStart"></div>
      <div><label>종료일 (기간 일정일 때만)</label><input type="date" id="fEnd"></div>
    </div>
    <div class="field"><label>메모</label><textarea id="fMemo"></textarea></div>
    <div class="field checks">
      <label><input type="checkbox" id="fMs"> 핵심 이정표 (D-day 표시)</label>
      <label><input type="checkbox" id="fDone"> 완료</label>
    </div>
    <div class="note" id="fKeyNote" style="display:none"></div>
    <div class="mfoot">
      <button class="btn danger" id="mDel">삭제</button>
      <div class="spacer"></div>
      <button class="btn" id="mCancel">취소</button>
      <button class="btn primary" id="mSave">저장</button>
    </div>
  </div>
</div>

<script>
const CATS = {
  study:  {name:'학업',          color:'#3b5bdb'},
  work:   {name:'직장·커리어',    color:'#e8590c'},
  home:   {name:'주거·대출',      color:'#2f9e44'},
  health: {name:'건강·다이어트',  color:'#d6336c'},
  love:   {name:'연애·결혼',      color:'#ae3ec9'},
  etc:    {name:'기타',          color:'#868e96'}
};
const KEYNAMES = {graduation:'석사 졸업', job:'정규직 입사', movein:'아파트 입주', wedding:'결혼식', weight:'감량 달성', love:'연애 시작'};
const STORE = 'lifeRoadmapCalendar.v1';

/* ---------- 유틸 ---------- */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36);
const pad = n => String(n).padStart(2,'0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const today = () => { const t = new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); };
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const diffDays = (a, b) => Math.round((parse(b) - parse(a)) / 864e5); // b - a
const monthsBetween = (a, b) => { const A = parse(a), B = parse(b); let m = (B.getFullYear()-A.getFullYear())*12 + (B.getMonth()-A.getMonth()); if (B.getDate() < A.getDate()) m--; return m; };
const fmt = s => { const d = parse(s); return `${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()}(${'일월화수목금토'[d.getDay()]})`; };
const short = s => { const d = parse(s); return `${String(d.getFullYear()).slice(2)}.${d.getMonth()+1}.${d.getDate()}`; };
const dday = s => { const n = diffDays(ymd(today()), s); return n === 0 ? 'D-DAY' : n > 0 ? 'D-' + n : 'D+' + (-n); };
const col = e => (CATS[e.cat] || CATS.etc).color;
const isRange = e => e.end && e.end > e.start;
const endOf = e => isRange(e) ? e.end : e.start;
const byDate = (a, b) => a.start.localeCompare(b.start) || endOf(a).localeCompare(endOf(b));

/* ---------- 기본 일정 ---------- */
function seed() {
  const L = [];
  const E = (cat, title, start, end = '', o = {}) =>
    L.push({id: uid(), cat, title, start, end, memo: o.memo || '', milestone: !!o.ms, done: false, key: o.key || ''});

  // 학업 (2026년 2학기 입학, 4학기 과정 기준 예상)
  E('study', '석사 1학기 (1학년 1학기)', '2026-09-01', '2026-12-18', {memo:'성균관대학교 스마트팩토리융합학과 석사과정'});
  E('study', '석사 2학기 (1학년 2학기)', '2027-03-02', '2027-06-18');
  E('study', '석사 3학기 (2학년 1학기)', '2027-09-01', '2027-12-17');
  E('study', '논문 주제 확정 · 지도교수 면담', '2027-11-26');
  E('study', '석사 4학기 (2학년 2학기) · 논문 학기', '2028-03-02', '2028-06-16');
  E('study', '학위논문 심사', '2028-05-01', '2028-06-09', {memo:'심사 일정은 학과 공지에 맞춰 수정하세요'});
  E('study', '🎓 석사 졸업 (학위수여식)', '2028-08-25', '', {ms:1, key:'graduation', memo:'2026년 2학기 입학 · 4학기 과정 기준 예상일입니다. 학사일정이 확정되면 날짜를 수정하세요.'});

  // 직장·커리어
  E('work', 'SK매직 종로 FP 담당 (외주) 재직', '2026-09-01', '2028-08-31', {memo:'졸업 시점까지 재직 유지. 시작일은 실제 입사일로 수정하세요.'});
  E('work', '이직 준비 (이력서·포트폴리오·자격증)', '2028-01-03', '2028-05-31', {memo:'석사 연구 + 스마트팩토리 관련 경험을 포트폴리오로 정리'});
  E('work', '정규직 지원·면접 집중 기간', '2028-06-01', '2028-08-31');
  E('work', '💼 정규직 입사 (목표)', '2028-09-01', '', {ms:1, key:'job', memo:'졸업 직후 입사 목표. 잔금대출 심사 때 재직기간·소득 증빙이 필요합니다.'});
  E('work', '정규직 입사 마지노선', '2029-02-28', '', {memo:'이 날짜까지 입사하면 입주 시점에 재직 1년을 확보할 수 있어요'});

  // 건강·다이어트 (현재 -8kg, 월 10kg 페이스)
  E('health', '다이어트 집중기 (월 10kg 페이스)', '2026-11-05', '2027-01-11');
  E('health', '감량 중간목표 -18kg', '2026-12-05');
  E('health', '감량 중간목표 -28kg', '2027-01-05');
  E('health', '🏃 30kg 감량 달성', '2027-01-11', '', {ms:1, key:'weight'});

/* ---------- 상태 ---------- */
function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (raw) { const d = JSON.parse(raw); if (Array.isArray(d.events)) { d.weight = d.weight || {goal:30, logs:[]}; return d; } }
  } catch (e) {}
  return seed();
}
let S = load();
const save = () => localStorage.setItem(STORE, JSON.stringify(S));
save();

const filterOff = new Set();
const visible = () => S.events.filter(e => !filterOff.has(e.cat));
const K = key => S.events.find(e => e.key === key);
let cur = {y: today().getFullYear(), m: today().getMonth()};

function weightState() {
  const logs = [...S.weight.logs].sort((a, b) => a.date.localeCompare(b.date));
  const last = logs[logs.length - 1] || {date: ymd(today()), lost: 0};
  const lost = +last.lost || 0, goal = +S.weight.goal || 30;
  return {logs, last, lost, goal, remain: Math.max(0, +(goal - lost).toFixed(1)), pct: Math.min(100, lost / goal * 100)};
}

/* ---------- 렌더링 ---------- */
function renderHero() {
  const m = K('movein');
  if (!m) { $('hero').innerHTML = ''; return; }
  const n = diffDays(ymd(today()), m.start);
  $('hero').innerHTML = `🏠 아파트 입주까지<b>${n > 0 ? 'D-' + n : n === 0 ? 'D-DAY' : '입주 완료 🎉'}</b>${fmt(m.start)}`;
}

function renderFilters() {
  $('filters').innerHTML = Object.entries(CATS).map(([k, c]) =>
    `<span class="fchip ${filterOff.has(k) ? 'off' : ''}" data-cat="${k}"><i style="background:${c.color}"></i>${c.name}</span>`).join('');
}

function checks() {
  const g = K('graduation'), j = K('job'), m = K('movein'), w = K('wedding');
  const out = [];
  if (g && j) {
    const ok = j.start >= g.start;
    out.push({lv: ok ? 'ok' : 'warn', t: '졸업 때까지 현 직장(외주) 유지',
      d: ok ? `졸업 ${fmt(g.start)} → 정규직 입사 ${fmt(j.start)} (졸업 후 ${diffDays(g.start, j.start)}일)` : `정규직 입사 예정일이 졸업보다 ${diffDays(j.start, g.start)}일 빠릅니다`});
  } else out.push({lv:'caution', t:'졸업 때까지 현 직장(외주) 유지', d:'졸업 또는 정규직 입사 핵심 일정이 없습니다'});

  if (j && m) {
    const mo = monthsBetween(j.start, m.start);
    const lv = mo >= 12 ? 'ok' : mo >= 6 ? 'caution' : 'warn';
    out.push({lv, t: '잔금대출 시점 정규직 재직기간',
      d: mo < 0 ? '입사 예정일이 입주일보다 늦습니다 — 잔금대출 전 입사 필요'
        : `입주일 기준 약 ${mo}개월 재직 예정 ${mo >= 12 ? '— 여유 있음' : '— 짧은 편이에요. 은행별 재직기간 기준을 미리 확인하세요'}`});
  } else out.push({lv:'caution', t:'잔금대출 시점 정규직 재직기간', d:'정규직 입사 또는 입주 핵심 일정이 없습니다'});

  if (w && m) {
    const n = diffDays(w.start, m.start);
    out.push({lv: n > 0 ? 'ok' : 'warn', t: '입주 전 결혼식',
      d: n > 0 ? `결혼식 ${fmt(w.start)} → 입주 ${n}일 전` : '결혼식이 입주일 이후로 잡혀 있습니다'});
  } else out.push({lv:'caution', t:'입주 전 결혼식', d:'결혼식 또는 입주 핵심 일정이 없습니다'});

  const ws = weightState();
  out.push({lv: ws.remain <= 0 ? 'ok' : 'caution', t: `${ws.goal}kg 감량`,
    d: ws.remain <= 0 ? `목표 달성! 현재 -${ws.lost}kg` : `현재 -${ws.lost}kg · 남은 감량 ${ws.remain}kg (${ws.pct.toFixed(0)}%)`});
  return out;
}

function renderDash() {
  const t = ymd(today());
  const ms = visible().filter(e => e.milestone).sort(byDate);
  $('msList').innerHTML = ms.length ? ms.map(e => {
    const past = e.start < t;
    return `<div class="ms ${past || e.done ? 'past' : ''}" style="border-left-color:${col(e)}" data-id="${e.id}">
      <div class="dd" style="color:${col(e)}">${e.done ? '달성 ✔' : dday(e.start)}</div>
      <div class="tt">${esc(e.title)}</div><div class="dt">${fmt(e.start)}</div></div>`;
  }).join('') : '<div class="empty">핵심 이정표가 없습니다</div>';

  $('checks').innerHTML = checks().map(c =>
    `<div class="chk"><div class="dot lv-${c.lv}">${c.lv === 'ok' ? '✓' : '!'}</div><div><div class="t">${c.t}</div><div class="d">${c.d}</div></div></div>`).join('');

  const lim = ymd(addDays(today(), 90));
  const up = visible().filter(e => !e.done && endOf(e) >= t && e.start <= lim).sort(byDate).slice(0, 10);
  $('upcoming').innerHTML = up.length ? up.map(e => `<div class="up" data-id="${e.id}">
      <div class="bd" style="background:${col(e)}"></div>
      <div class="when">${short(e.start)}${isRange(e) ? ' ~ ' + short(e.end) : ''}</div>
      <div class="ut">${esc(e.title)}</div>
      <div class="ddtag">${e.start >= t ? dday(e.start) : '진행 중'}</div></div>`).join('')
    : '<div class="empty">90일 안에 예정된 일정이 없습니다</div>';

  renderWeight();
}

function renderWeight() {
  const ws = weightState();
  const eta = ws.remain > 0 ? fmt(ymd(addDays(parse(ws.last.date), Math.ceil(ws.remain / 10 * 30)))) : '달성 완료 🎉';
  $('weightCard').innerHTML = `
    <h2>🏃 다이어트 트래커 <small>누적 감량 kg 기록</small></h2>
    <div class="wbig"><b>-${ws.lost}kg</b><span>/ 목표 -${ws.goal}kg</span></div>
    <div class="bar"><div style="width:${ws.pct}%"></div></div>
    <div class="wmeta"><span>${ws.pct.toFixed(0)}% 달성</span><span>남은 감량 ${ws.remain}kg</span></div>
    <div style="margin-top:12px;font-size:13px">월 10kg 페이스 유지 시 예상 달성일: <b>${eta}</b></div>
    <div class="wform">
      <input type="date" id="wDate" value="${ymd(today())}">
      <input type="number" id="wLost" step="0.1" min="0" placeholder="누적 감량 kg (예: 10.5)">
      <button class="btn primary" id="wAdd">기록</button>
    </div>
    <div style="display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--sub)">
      목표 감량 <input type="number" id="wGoal" value="${ws.goal}" step="1" min="1" style="width:72px;padding:4px 8px"> kg
    </div>
    <div class="wlog">${ws.logs.slice().reverse().map(l =>
      `<div><span>${fmt(l.date)}</span><span><b>-${l.lost}kg</b> <a href="#" data-wdel="${l.date}" title="기록 삭제" style="color:#adb5bd;margin-left:8px;text-decoration:none">✕</a></span></div>`).join('')}</div>
    <div class="note">💡 일반적으로 권장되는 감량 속도는 주 0.5~1kg 정도예요. 월 10kg처럼 빠른 감량은 근손실·요요 위험이 있으니 가능하면 전문의·영양사와 상의하며 진행하세요.</div>`;

  $('wAdd').onclick = () => {
    const d = $('wDate').value, v = parseFloat($('wLost').value);
    if (!d || isNaN(v)) { alert('날짜와 누적 감량(kg)을 입력하세요'); return; }
    S.weight.logs = S.weight.logs.filter(l => l.date !== d);
    S.weight.logs.push({date: d, lost: v});
    save(); renderAll();
  };
  $('wGoal').onchange = e => { const v = parseFloat(e.target.value); if (v > 0) { S.weight.goal = v; save(); renderAll(); } };
  $('weightCard').querySelectorAll('[data-wdel]').forEach(a => a.onclick = ev => {
    ev.preventDefault();
    if (!confirm('이 기록을 삭제할까요?')) return;
    S.weight.logs = S.weight.logs.filter(l => l.date !== a.dataset.wdel);
    save(); renderAll();
  });
}

function renderCal() {
  $('calTitle').textContent = `${cur.y}년 ${cur.m + 1}월`;
  $('jumpY').value = cur.y; $('jumpM').value = cur.m;
  const first = new Date(cur.y, cur.m, 1), dim = new Date(cur.y, cur.m + 1, 0).getDate(), sd = first.getDay();
  const weeks = Math.ceil((sd + dim) / 7);
  const mStart = ymd(first), mEnd = ymd(new Date(cur.y, cur.m, dim));
  const ev = visible();
  const isLong = e => isRange(e) && diffDays(e.start, e.end) > 14;

  const og = ev.filter(e => isLong(e) && e.start <= mEnd && e.end >= mStart).sort(byDate);
  $('ongoing').innerHTML = og.length
    ? '<span style="font-size:12px;color:var(--sub)">이번 달 진행 중인 기간 일정 :</span>' +
      og.map(e => `<span class="og" data-id="${e.id}" style="background:${col(e)}">${esc(e.title)} (${short(e.start)} ~ ${short(e.end)})</span>`).join('')
    : '';

  let h = '일월화수목금토'.split('').map((d, i) => `<div class="dow ${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${d}</div>`).join('');
  const t = ymd(today());
  for (let i = 0; i < weeks * 7; i++) {
    const d = new Date(cur.y, cur.m, 1 - sd + i), ds = ymd(d), dow = d.getDay();
    const items = [];
    ev.forEach(e => {
      if (isLong(e)) {
        if (e.start === ds) items.push({e, label: '▶ ' + e.title + ' 시작', edge: 1});
        else if (e.end === ds) items.push({e, label: '■ ' + e.title + ' 종료', edge: 1});
      } else if (e.start <= ds && endOf(e) >= ds) items.push({e, label: e.title});
    });
    items.sort((a, b) => (b.e.milestone - a.e.milestone));
    h += `<div class="day ${d.getMonth() !== cur.m ? 'other' : ''} ${ds === t ? 'today' : ''}" data-date="${ds}">
      <div class="num ${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''}">${d.getDate()}</div>
      ${items.map(x => `<div class="chip ${x.e.milestone ? 'ms-chip' : ''} ${x.e.done ? 'done' : ''} ${x.edge ? 'edge' : ''}" data-id="${x.e.id}"
        style="${x.edge ? `border-color:${col(x.e)};color:${col(x.e)}` : `background:${col(x.e)}`}" title="${esc(x.label)}">${esc(x.label)}</div>`).join('')}
    </div>`;
  }
  $('cal').innerHTML = h;
}

function renderRoad() {
  const R0 = '2026-09-01', R1 = '2030-06-30', t0 = parse(R0), span = parse(R1) - t0;
  const pct = s => Math.max(0, Math.min(100, (parse(s) - t0) / span * 100));
  const years = [2027, 2028, 2029, 2030];
  const ticks = () => years.map(y => `<div class="tick" style="left:${pct(y + '-01-01')}%"></div>`).join('')
    + `<div class="todayline" style="left:${pct(ymd(today()))}%"></div>`;
  const ev = visible();

  let h = `<div class="lane"><div class="lb"></div><div class="track" style="height:24px">
    <div class="tick" style="left:0;border:0"><span>2026.9</span></div>
    ${years.map(y => `<div class="tick" style="left:${pct(y + '-01-01')}%"><span>${y}</span></div>`).join('')}</div></div>`;

  const ms = ev.filter(e => e.milestone).sort(byDate);
  h += `<div class="lane"><div class="lb">⭐ 핵심 이정표</div><div class="track" style="height:112px">${ticks()}
    ${ms.map((e, i) => `<div class="mstone" data-id="${e.id}" style="left:${pct(e.start)}%;top:${i % 2 ? 58 : 6}px" title="${esc(e.title)} · ${fmt(e.start)}">
      <div class="dm" style="background:${col(e)}"></div><div class="ml">${esc(e.title)}</div><div class="md">${short(e.start)}</div></div>`).join('')}
    </div></div>`;

  Object.entries(CATS).forEach(([k, c]) => {
    if (filterOff.has(k)) return;
    const items = ev.filter(e => e.cat === k).sort(byDate);
    if (!items.length) return;
    const ranges = items.filter(isRange), points = items.filter(e => !isRange(e));
    const rows = [];
    const placed = ranges.map(e => {
      let r = rows.findIndex(end => end < e.start);
      if (r < 0) { r = rows.length; rows.push(e.end); } else rows[r] = e.end;
      return {e, r};
    });
    const pointTop = 10, barTop = 32;
    const height = barTop + Math.max(1, rows.length) * 16 + 6;
    let inner = ticks();
    points.forEach(e => {
      const big = e.milestone ? `;width:16px;height:16px;margin-left:-8px;top:${pointTop - 2}px` : '';
      inner += `<div class="rdot" data-id="${e.id}" style="left:${pct(e.start)}%;top:${pointTop}px;background:${c.color}${big}" title="${esc(e.title)} · ${fmt(e.start)}"></div>`;
    });
    placed.forEach(({e, r}) => {
      const l = pct(e.start), w = Math.max(.5, pct(e.end) - l);
      inner += `<div class="rbar" data-id="${e.id}" style="left:${l}%;width:${w}%;top:${barTop + r * 16}px;background:${c.color}" title="${esc(e.title)} · ${fmt(e.start)} ~ ${fmt(e.end)}"></div>`;
    });
    h += `<div class="lane"><div class="lb"><i style="background:${c.color}"></i>${c.name}</div><div class="track" style="height:${height}px">${inner}</div></div>`;
  });
  $('roadmap').innerHTML = h;
}

function renderList() {
  const q = $('search').value.trim().toLowerCase(), hp = $('hidePast').checked, t = ymd(today());
  const items = visible()
    .filter(e => (!q || (e.title + ' ' + e.memo).toLowerCase().includes(q)) && (!hp || endOf(e) >= t))
    .sort(byDate);
  if (!items.length) { $('list').innerHTML = '<div class="empty">일정이 없습니다</div>'; return; }
  let h = '', yr = '';
  items.forEach(e => {
    const y = e.start.slice(0, 4);
    if (y !== yr) { yr = y; h += `<div class="lst-year">${y}년</div>`; }
    const c = CATS[e.cat] || CATS.etc;
    h += `<div class="item ${e.done ? 'done' : ''}">
      <div class="bd" style="background:${c.color}"></div>
      <input type="checkbox" data-toggle="${e.id}" ${e.done ? 'checked' : ''} title="완료 표시">
      <div class="main" data-id="${e.id}">
        <div class="ti">${esc(e.title)}${e.milestone ? '<span class="badge">이정표</span>' : ''}</div>
        <div class="meta">${c.name} · ${fmt(e.start)}${isRange(e) ? ' ~ ' + fmt(e.end) : ''} · ${dday(e.start)}</div>
        ${e.memo ? `<div class="memo">${esc(e.memo)}</div>` : ''}
      </div></div>`;
  });
  $('list').innerHTML = h;
}

function renderAll() { renderHero(); renderFilters(); renderDash(); renderCal(); renderRoad(); renderList(); }

/* ---------- 일정 추가/수정 모달 ---------- */
let editId = null;
$('fCat').innerHTML = Object.entries(CATS).map(([k, c]) => `<option value="${k}">${c.name}</option>`).join('');

function openModal(id, date) {
  editId = id;
  const e = id ? S.events.find(x => x.id === id) : null;
  if (id && !e) return;
  $('mTitle').textContent = e ? '일정 수정' : '일정 추가';
  $('fTitle').value = e ? e.title : '';
  $('fCat').value = e ? e.cat : 'etc';
  $('fStart').value = e ? e.start : (date || ymd(today()));
  $('fEnd').value = e ? e.end : '';
  $('fMemo').value = e ? e.memo : '';
  $('fMs').checked = e ? e.milestone : false;
  $('fDone').checked = e ? e.done : false;
  $('mDel').style.visibility = e ? 'visible' : 'hidden';
  const kn = e && e.key ? KEYNAMES[e.key] : '';
  $('fKeyNote').style.display = kn ? 'block' : 'none';
  $('fKeyNote').textContent = kn ? `📍 이 일정은 '${kn}' 핵심 일정이라 대시보드의 조건 체크 계산에 쓰여요. 날짜를 바꾸면 자동으로 다시 계산됩니다.` : '';
  $('overlay').classList.add('show');
  setTimeout(() => $('fTitle').focus(), 50);
}
const closeModal = () => { $('overlay').classList.remove('show'); editId = null; };

$('mSave').onclick = () => {
  const title = $('fTitle').value.trim(), start = $('fStart').value;
  let end = $('fEnd').value;
  if (!title) { alert('제목을 입력하세요'); return; }
  if (!start) { alert('시작일을 입력하세요'); return; }
  if (end && end < start) { alert('종료일이 시작일보다 빠릅니다'); return; }
  if (end === start) end = '';
  const data = {title, cat: $('fCat').value, start, end, memo: $('fMemo').value.trim(), milestone: $('fMs').checked, done: $('fDone').checked};
  if (editId) Object.assign(S.events.find(x => x.id === editId), data);
  else S.events.push({id: uid(), key: '', ...data});
  save(); closeModal(); renderAll();
};
$('mDel').onclick = () => {
  const e = S.events.find(x => x.id === editId);
  if (!e) return;
  const msg = e.key ? `'${KEYNAMES[e.key]}' 핵심 일정입니다. 삭제하면 조건 체크가 계산되지 않아요. 그래도 삭제할까요?` : `'${e.title}' 일정을 삭제할까요?`;
  if (!confirm(msg)) return;
  S.events = S.events.filter(x => x.id !== editId);
  save(); closeModal(); renderAll();
};
$('mCancel').onclick = closeModal;
$('overlay').addEventListener('mousedown', e => { if (e.target === $('overlay')) closeModal(); });
document.addEventListener('keydown', e => {
  if (!$('overlay').classList.contains('show')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); $('mSave').click(); }
});

/* ---------- 이벤트 ---------- */
document.addEventListener('click', ev => {
  if (ev.target.closest('.overlay')) return;
  const tg = ev.target.closest('[data-toggle]');
  if (tg) { const e = S.events.find(x => x.id === tg.dataset.toggle); if (e) { e.done = tg.checked; save(); renderAll(); } return; }
  const it = ev.target.closest('[data-id]');
  if (it) { openModal(it.dataset.id); return; }
  const day = ev.target.closest('[data-date]');
  if (day) openModal(null, day.dataset.date);
});

$('tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('active', x === b));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + b.dataset.view));
};
$('filters').onclick = e => {
  const t = e.target.closest('.fchip'); if (!t) return;
  const k = t.dataset.cat;
  filterOff.has(k) ? filterOff.delete(k) : filterOff.add(k);
  renderAll();
};
$('addBtn').onclick = () => openModal(null);

const shiftMonth = n => { const d = new Date(cur.y, cur.m + n, 1); cur = {y: d.getFullYear(), m: d.getMonth()}; renderCal(); };
$('prevM').onclick = () => shiftMonth(-1);
$('nextM').onclick = () => shiftMonth(1);
$('todayM').onclick = () => { cur = {y: today().getFullYear(), m: today().getMonth()}; renderCal(); };
for (let y = 2026; y <= 2031; y++) $('jumpY').insertAdjacentHTML('beforeend', `<option value="${y}">${y}년</option>`);
for (let m = 0; m < 12; m++) $('jumpM').insertAdjacentHTML('beforeend', `<option value="${m}">${m + 1}월</option>`);
$('jumpY').onchange = e => { cur.y = +e.target.value; renderCal(); };
$('jumpM').onchange = e => { cur.m = +e.target.value; renderCal(); };

$('search').oninput = renderList;
$('hidePast').onchange = renderList;

$('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(S, null, 2)], {type: 'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `life-calendar-backup-${ymd(today())}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!Array.isArray(d.events)) throw new Error('invalid');
      d.weight = d.weight || {goal: 30, logs: []};
      S = d; save(); renderAll(); alert('백업을 불러왔습니다');
    } catch (err) { alert('올바른 백업 파일이 아닙니다'); }
  };
  r.readAsText(f);
  e.target.value = '';
};
$('resetBtn').onclick = () => {
  if (confirm('모든 일정과 감량 기록을 처음 기본값으로 되돌릴까요?\n(먼저 "백업 저장"을 권장합니다)')) { S = seed(); save(); renderAll(); }
};

renderAll();
</script>
</body>
</html>
